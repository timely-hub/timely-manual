site_name: 타임리AI 사용설명서
site_description: Timely AI 서비스 사용설명서
site_url: https://timely-hub.github.io/timely-manual/

nav:
  - 홈: index.md
  - 어드민 가이드:
      - 시작하기:
          - 스페이스 설정: admin/getting-started/space-setup.md
          - 유저 초대·관리: admin/getting-started/invite-users.md
          - 템플릿 관리: admin/getting-started/templates.md
          - 크레딧 결제: admin/getting-started/credits.md
      - 권한: admin/permissions.md
      - 통계: admin/stats.md
  - 유저 가이드:
      - 개요: user/getting-started/overview.md
      - 타임리 AI:
          - AI 채팅: user/getting-started/ai-chat.md
          - 프로젝트: user/getting-started/project.md
          - 템플릿/챗봇: user/getting-started/templates-chatbot.md
          - 스토어: user/getting-started/store.md
          - Labs: user/getting-started/labs.md
      - 타임리 에이전트: user/getting-started/agents.md
      - 계정 설정: user/getting-started/my-account.md
  - AI 모델별 특징 안내: ai-models.md
  - 영상 튜토리얼: tutorials.md
  - FAQ: faq.md
  - 참고:
      - 할루시네이션 줄이기: hallucination.md
      - 모바일 앱: app.md
      - 직접 문의: contact.md
      - Privacy: privacy.md

theme:
  name: material
  custom_dir: overrides
  language: ko
  logo: assets/img/logo.svg
  favicon: assets/img/favicon.ico
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  # Light only — matches the Timely service. No toggle, no OS-preference detection,
  # so the look stays consistent across visits / users / system settings.
  # (Reintroduce the slate palette if a dark mode is ever wanted.)
  palette:
    # 1) 기본: 시스템(OS/브라우저) 설정 자동 따라가기
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: 시스템 설정을 따르는 중 — 클릭하면 라이트
    # 2) 라이트 고정
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 라이트 모드 — 클릭하면 다크
    # 3) 다크 고정
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 다크 모드 — 클릭하면 시스템 설정
  font:
    text: Pretendard
    code: JetBrains Mono

extra_css:
  - assets/css/brand.css

extra_javascript:
  - assets/js/print.js
  - assets/js/user-guide-nav.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - ko
        - en

extra:
  generator: false   # hide "Made with Material for MkDocs" footer line
  social:
    - icon: fontawesome/solid/house
      link: https://www.timelygpt.co.kr/main
      name: 타임리AI 홈페이지

copyright: © Timely. All rights reserved.
